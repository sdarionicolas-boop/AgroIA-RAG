services:
  api:
    build: .
    container_name: agroia_api
    env_file:
      - config/.env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    command: ["python", "-m", "uvicorn", "src.ingesta.api:app", "--host", "0.0.0.0", "--port", "8000"]

  streamlit:
    build: .
    container_name: agroia_ui
    env_file:
      - config/.env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/streamlit_app.py", "--server.address=0.0.0.0"]
